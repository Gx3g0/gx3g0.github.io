<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G3verse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f1a;--panel:#171933;--panel2:#20234a;--text:#f3f3fb;--muted:#9fa2c8;--line:#2d3060;--accent:#ffcf3f;--good:#3ddc84;--bad:#ff5d73;--mid:#ffb02e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;line-height:1.45}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 12% 8%,#3a24896b,transparent 42%),radial-gradient(circle at 90% 95%,#0b6b6b55,transparent 45%);pointer-events:none;z-index:-1}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:10px 16px;background:var(--panel2);color:var(--text);transition:transform .1s,background .2s}
button:hover{background:#2b2f63}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#1b1b1b;font-weight:700}
button.primary:hover{background:#ffdb66}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;background:var(--panel2);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
input[type=file]{padding:8px;font-size:.9rem;max-width:100%}
.muted{color:var(--muted)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 16px;background:#0e0f1ad9;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.burger{width:46px;height:46px;padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger i{display:block;width:22px;height:3px;background:var(--text);border-radius:3px}
.logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.25rem}
.crumb{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);background:var(--panel);border-right:1px solid var(--line);z-index:50;transform:translateX(-102%);transition:transform .28s cubic-bezier(.3,.8,.3,1);overflow-y:auto;padding:16px}
#drawer.open{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:'Bricolage Grotesque';font-size:1.2rem}
.dhead .x{padding:6px 12px}
.dsec{margin-bottom:22px}
.dlabel{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-weight:700}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lang{padding:9px 10px;text-align:left;font-size:.93rem}
.lang.on{background:var(--accent);color:#1b1b1b;font-weight:700}
.ditem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-weight:500}
.ditem:hover{background:var(--panel2)}
.ditem.on{background:var(--panel2);outline:2px solid var(--accent)}
.dem{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;font-size:1.1rem}
main{padding:0 16px 60px}
.hero{max-width:1100px;margin:0 auto;padding:44px 0 22px;text-align:center}
.hero h1{font-size:clamp(2.6rem,7vw,4.4rem);font-weight:800;background:linear-gradient(90deg,#ffcf3f,#ff6b9a,#8f7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:1.1rem;margin:8px 0 24px}
.searchrow{display:flex;flex-direction:column;align-items:center;gap:12px}
.searchrow input{width:min(460px,100%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:7px 14px;border-radius:99px;font-size:.92rem}
.chip.on{background:var(--text);color:var(--bg);font-weight:700}
.grid{max-width:1100px;margin:10px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;transition:transform .18s,border-color .18s,box-shadow .18s;overflow:hidden;cursor:pointer;text-align:left;color:var(--text)}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 12px 30px -12px var(--c);background:var(--panel)}
.cicon{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--c) 22%,transparent)}
.card h3{font-size:1.3rem;margin-top:4px}
.card p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.cfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.tag.day{background:#ffcf3f22;color:#ffe08a}
.insp{font-size:.78rem;color:var(--muted);font-style:italic}
.playbtn{margin-top:6px;font-weight:700;color:var(--c)}
.gwrap{max-width:820px;margin:0 auto;padding-top:22px}
.ghead{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.gicon{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:2.2rem;background:color-mix(in srgb,var(--c) 25%,transparent)}
.ghead h1{font-size:1.9rem}
.ghead p{margin:2px 0 0;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.bar.daily{background:linear-gradient(90deg,#ffcf3f1f,#ff6b9a1a);border-color:#ffcf3f55}
.intro{color:var(--muted);margin:0 0 14px}
.note{color:var(--muted);font-size:.85rem;margin-top:14px}
.cnote{background:#ffcf3f1a;border:1px solid #ffcf3f55;color:#ffe08a;padding:8px 12px;border-radius:12px;font-size:.88rem;margin-bottom:12px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.msg{min-height:1.5em;margin:8px 0;font-weight:500}
.center{text-align:center}
.big{font-size:1.5rem;font-family:'Bricolage Grotesque';font-weight:700}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button.on{background:var(--accent);color:#1b1b1b;font-weight:700}
.result{margin-top:14px;padding:14px;border-radius:14px;background:var(--panel2)}
/* loyer */
.listing{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lmedia{display:grid;grid-template-columns:1fr 1fr;min-height:260px}
.lphoto{position:relative;background:linear-gradient(135deg,#ff8a3d55,#8f7bff44);display:grid;place-items:center;font-size:5rem;overflow:hidden}
.lphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lphoto .cap{position:absolute;left:8px;bottom:8px;font-size:.72rem;background:#000a;padding:2px 8px;border-radius:6px}
.smap{position:relative;overflow:hidden;background:#aac7d8;height:260px}
.smap .fb{position:absolute;inset:0}
.smap img{position:absolute;width:256px;height:256px}
.smap .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:2.2rem;filter:drop-shadow(0 2px 3px #0008);z-index:3}
.smap .zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:4}
.smap .zb button{width:32px;height:32px;padding:0;background:#fff;color:#111;font-weight:800}
.smap .attr{position:absolute;right:0;bottom:0;font-size:10px;background:#fffc;color:#333;padding:1px 5px;z-index:4}
.smap .lbl{position:absolute;left:8px;top:8px;background:#000b;padding:3px 9px;border-radius:8px;font-size:.85rem;z-index:4}
.linfo{padding:16px}
.linfo h2{font-size:1.5rem;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{background:var(--panel2);padding:6px 12px;border-radius:99px;font-size:.95rem}
.pills span b{font-size:1.05rem}
.q{margin:20px 0 10px}
.guessbox{display:flex;flex-direction:column;gap:10px}
.guessbox input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:none;background:none}
.numrow{display:flex;align-items:center;gap:8px}
.numrow input{width:130px;font-size:1.2rem;font-weight:700}
@media(max-width:620px){.lmedia{grid-template-columns:1fr}.lphoto{height:180px}}
/* semantik */
.semlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.srow{display:grid;grid-template-columns:44px 1fr 74px 30px 120px;align-items:center;gap:8px;background:var(--panel);padding:7px 12px;border-radius:10px}
.srow.last{outline:2px solid var(--accent)}
.srow .n{color:var(--muted);font-size:.85rem}
.srow .w{font-weight:700}
.srow .tmp{text-align:right;font-variant-numeric:tabular-nums}
.meter{height:8px;background:#ffffff14;border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px}
.riddle{background:linear-gradient(135deg,#a66cff26,#ff6b9a1f);border:1px solid #a66cff66;border-radius:14px;padding:10px 14px;margin:6px 0;font-style:italic}
@media(max-width:520px){.srow{grid-template-columns:32px 1fr 62px 26px 54px}}
/* pedanto */
.ptitle{font-family:'Bricolage Grotesque';font-size:1.6rem;margin-bottom:12px}
.ptext{font-size:1.06rem;line-height:2}
.hid{display:inline-block;height:1.1em;vertical-align:-.15em;background:#3a3e78;border-radius:4px;cursor:help}
.new{background:#ffcf3f40;border-radius:4px;padding:0 2px}
.glog{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.glog span{font-size:.85rem;background:var(--panel2);padding:4px 10px;border-radius:99px}
/* dessin */
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:14px 0}
.passbox{text-align:center;padding:50px 20px}
.passbox .who{font-size:2.2rem;font-family:'Bricolage Grotesque';font-weight:800;color:var(--accent);margin:8px 0 22px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--accent)}
.sz{width:38px;height:34px;padding:0;display:grid;place-items:center}
.sz i{display:block;background:var(--text);border-radius:50%}
.sz.on,.er.on{outline:2px solid var(--accent)}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.cv{width:100%;aspect-ratio:10/7;background:#fff;border-radius:14px;touch-action:none;cursor:crosshair;display:block}
.prompt{background:var(--panel2);padding:12px 16px;border-radius:14px;font-size:1.25rem;font-weight:700;margin-bottom:12px}
.album{display:flex;flex-direction:column;gap:12px}
.aitem{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.aitem .by{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.aitem .txt{font-size:1.25rem;font-weight:700}
.aitem img{width:100%;border-radius:12px;display:block}
/* wiki */
.wroute{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wroute b{background:var(--panel2);padding:4px 10px;border-radius:8px}
.article{background:#fff;color:#202122;border-radius:16px;padding:22px;font-family:sans-serif;overflow-x:auto}
.article h2.at{font-family:Georgia,serif;font-weight:400;font-size:2rem;border-bottom:1px solid #a2a9b1;padding-bottom:6px;margin-bottom:14px}
.article p{line-height:1.65}
.article .mini{font-family:Georgia,serif;font-size:1.1rem;line-height:1.75;margin:0}
.wikibody{font-size:.95rem;line-height:1.6}
.wikibody h2,.wikibody h3{font-family:Georgia,serif;font-weight:400;border-bottom:1px solid #c8ccd1;margin:1em 0 .4em;letter-spacing:0}
.wikibody img{max-width:100%;height:auto}
.wikibody table{max-width:100%;border-collapse:collapse;font-size:.88rem}
.wikibody .infobox,.wikibody .infobox_v2,.wikibody .infobox_v3{float:right;margin:0 0 10px 14px;max-width:300px;border:1px solid #c8ccd1;background:#f8f9fa;padding:6px}
.wikibody .thumb,.wikibody figure{max-width:280px}
.wikibody .tright,.wikibody figure.mw-halign-right{float:right;margin:0 0 10px 12px}
.wikibody .tleft,.wikibody figure.mw-halign-left{float:left;margin:0 12px 10px 0}
.wl{color:#3366cc;cursor:pointer;text-decoration:none}
.wl:hover{text-decoration:underline}
.wl.target{background:#ffeb8a}
.wpath{font-size:.88rem;color:var(--muted);margin:10px 0}
.wsticky{position:sticky;top:68px;z-index:5}
/* scene / doublage */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.scard:hover{border-color:var(--accent);background:var(--panel)}
.scard .se{font-size:2rem}
.scard .badge{align-self:flex-start;font-size:.8rem;background:var(--accent);color:#1b1b1b;font-weight:700;padding:2px 9px;border-radius:99px}
.scard.imp{border-style:dashed}
.cast{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cast span{padding:4px 12px;border-radius:99px;font-weight:700;font-size:.9rem}
.linecard{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px;text-align:center}
.linecard .who{font-weight:800;margin-bottom:8px}
.linecard .txt{font-size:1.5rem;font-weight:700;font-family:'Bricolage Grotesque';line-height:1.3}
.lines{display:flex;flex-direction:column;gap:4px;margin-top:14px}
.lines div{padding:6px 10px;border-radius:10px;background:var(--panel);font-size:.92rem;cursor:pointer;display:flex;gap:8px}
.lines div.on{outline:2px solid var(--accent)}
.rec{background:#ff3d57!important;color:#fff!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
video{width:100%;border-radius:14px;background:#000;max-height:420px}
.phr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--panel);padding:8px 10px;border-radius:12px;margin-top:6px}
.phr .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.phr .bt{display:flex;gap:4px;flex-wrap:wrap}
.phr .bt button{padding:6px 10px;font-size:.85rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
/* taille */
.tgrid{position:relative;height:400px;margin-top:40px;border-radius:14px;background-color:#f6f3e8;border:2px solid #d9d2bd;overflow:visible;touch-action:none}
.gl{position:absolute;left:0;right:0;border-top:1px solid #c9c0a5;height:0}
.gl span{position:absolute;left:4px;top:-17px;font-size:.72rem;color:#6d6550;font-weight:700}
.gl.real{border-top:3px dashed #e63946;z-index:6}
.gl.real span{color:#e63946;font-size:.85rem;left:auto;right:6px}
.vgl{position:absolute;top:0;bottom:0;border-left:1px solid #e3dcc7}
.tobj{position:absolute;bottom:0;display:flex;align-items:flex-end;justify-content:center;transition:height .6s}
.tobj .te{display:block;user-select:none;pointer-events:none;transition:width .6s,height .6s;overflow:visible}
.tobj .tl{pointer-events:none}
.tinfo{position:relative;z-index:8}
.tobj .tl{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.78rem;color:#3b3626;text-align:center;font-weight:700;background:#fffd;padding:1px 6px;border-radius:6px}
.tobj.tgt .tl{bottom:calc(100% + 34px)}
.handle{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);width:44px;height:28px;border-radius:9px;background:var(--accent);color:#1b1b1b;display:grid;place-items:center;font-weight:800;cursor:ns-resize;z-index:7;touch-action:none;box-shadow:0 2px 6px #0006}
.tgt .te{outline:2px dashed #ffcf3f;outline-offset:2px;border-radius:6px}
.tinfo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
/* abysse / space */
.qawrap{display:grid;grid-template-columns:1fr 190px;gap:16px}
.qawrap>*{min-width:0}
.qscene{position:relative;height:440px;border-radius:16px;overflow:hidden}
.qscene.abyss{background:linear-gradient(#7fd3f3 0%,#2a8ac4 6%,#0d4c8a 25%,#072a5a 50%,#04163a 75%,#01040c 100%)}
.qscene.space{background:linear-gradient(#000 0%,#0a0630 40%,#1b2a7a 75%,#4d8fd6 92%,#9fd6ff 100%)}
.qscene.space:after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 10%,#fff,transparent),radial-gradient(1px 1px at 70% 25%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 40%,#fff,transparent),radial-gradient(1px 1px at 85% 55%,#fff,transparent),radial-gradient(1px 1px at 10% 60%,#fff,transparent),radial-gradient(1px 1px at 55% 15%,#fff,transparent);pointer-events:none}
.ms{position:absolute;left:0;right:0;border-top:1px dashed #ffffff55;font-size:.68rem;color:#ffffffcc;padding:1px 4px}
.hero2{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:2.4rem;transition:top 1.2s cubic-bezier(.3,.8,.3,1),bottom 1.2s cubic-bezier(.3,.8,.3,1);z-index:2;filter:drop-shadow(0 0 6px #fff6)}
.qscene.space .hero2{transform:translate(-50%,50%)}
.gauge{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-weight:800;margin-top:8px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.qcard .qq{font-size:1.5rem;font-family:'Bricolage Grotesque';font-weight:800;margin:6px 0 14px}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.taglist span{background:var(--panel2);padding:3px 10px;border-radius:99px;font-size:.85rem}
@media(max-width:600px){.qawrap{grid-template-columns:1fr 110px}.qscene{height:380px}.hero2{font-size:1.8rem}}
/* motus */
.mgrid{display:grid;gap:6px;justify-content:center;margin:6px 0 16px}
.mrow{display:grid;grid-auto-flow:column;grid-auto-columns:50px;gap:6px}
.mc{height:50px;border-radius:10px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:var(--panel);border:2px solid var(--line);font-family:'Bricolage Grotesque'}
.mc.fx{color:#ffffff66}
.mc.g{background:#e8484b;border-color:#e8484b}
.mc.y{background:#f2b632;border-color:#f2b632;color:#1b1b1b;border-radius:50%}
.mc.b{background:#2a2d55;border-color:#2a2d55;color:#8c8fb8}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}
.kr{display:flex;gap:5px}
.k{min-width:34px;padding:12px 6px;font-weight:700;border-radius:8px}
.k.g{background:#e8484b}.k.y{background:#f2b632;color:#1b1b1b}.k.b{background:#15172e;color:#5d6090}
.opt{margin-bottom:14px}
.opt b{display:block;margin-bottom:6px}
@media(max-width:460px){.mrow{grid-auto-columns:40px}.mc{height:40px;font-size:1.2rem}.k{min-width:27px;padding:11px 3px;font-size:.85rem}}

/* Blind test */
.bt-stage{position:relative;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 120%,#ff4fa355,transparent 60%),linear-gradient(160deg,#1b1240,#0c0b1d);border:1px solid rgba(255,255,255,.1);padding:22px}
.bt-stage canvas{width:100%;height:170px;display:block}
.bt-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.bt-step{border-radius:14px;padding:10px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-weight:700;font-size:.9rem;transition:all .3s}
.bt-step .pt{display:block;font-size:.78rem;opacity:.7;font-weight:600}

function t(k,v){let s=(UI[lang]&&UI[lang][k])??UI.en[k]??UI.fr[k]??k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}
const L=o=>o[lang]??o.en??o.fr;
const cl=()=>lang==='fr'?'fr':'en';
const cnote=()=>(lang==='es'||lang==='de')?`<div class="cnote">🌐 ${t('contentNote')}</div>`:'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>new Intl.NumberFormat(lang).format(n);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
/* Numéro du jour : 15 novembre 2026 = n°1 */
function dayNum(){const d=new Date();const u=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());return Math.max(1,Math.floor((u-Date.UTC(2026,10,15))/864e5)+1)}
function dailyBar(n){return `<div class="bar daily"><span>📅 <b>n°${n}</b> · ${new Date().toLocaleDateString(lang,{weekday:'long',day:'numeric',month:'long'})}</span><span>⏳ ${t('newIn')} <b class="cd">--:--:--</b></span></div>`}
function startCountdown(){const day=dayNum();const upd=()=>{const d=new Date(),m=new Date(d);m.setHours(24,0,0,0);const s=Math.max(0,Math.floor((m-d)/1000));const p=x=>String(x).padStart(2,'0');document.querySelectorAll('.cd').forEach(e=>e.textContent=`${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`);if(dayNum()!==day)route()};upd();timers.push(setInterval(upd,1000))}
/* Wikipédia (fonctionne depuis le fichier ou un site hébergé ; bloqué dans la page publiée) */
async function commons(params){const qs=new URLSearchParams({...params,format:'json',formatversion:'2',origin:'*'});const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);try{const r=await fetch(`https://commons.wikimedia.org/w/api.php?${qs}`,{signal:ctl.signal});if(!r.ok)throw new Error('http');return await r.json()}finally{clearTimeout(to)}}
async function wapi(wl,params){const qs=new URLSearchParams({...params,format:'json',formatversion:'2',origin:'*'});const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);try{const r=await fetch(`https://${wl}.wikipedia.org/w/api.php?${qs}`,{signal:ctl.signal});if(!r.ok)throw new Error('http');const j=await r.json();if(j.error)throw new Error(j.error.info);return j}finally{clearTimeout(to)}}

async function askClaude(prompt){if(!SAMPLE)return null;try{return await SAMPLE.json(prompt,{modelTier:'quick'})}catch(e){if(e&&e.code==='not_granted')SAMPLE=null;return null}}
/* Micro */
let micStream=null;
async function getMic(){if(micStream&&micStream.active)return micStream;micStream=await navigator.mediaDevices.getUserMedia({audio:true});return micStream}
function startRec(stream){const mr=new MediaRecorder(stream);const ch=[];mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};const done=new Promise(r=>mr.onstop=()=>r(URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}))));mr.start();return{stop(){if(mr.state!=='inactive')mr.stop()},done}}


/* ================= EFFETS (toasts, confettis, ripple, tilt) ================= */
const fx={
  toast(m){const c=$('#toasts');if(!c)return;const d=document.createElement('div');d.className='toast';d.innerHTML=m;c.appendChild(d);setTimeout(()=>d.remove(),2900)},
  shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')},
  confetti(){const cv=$('#confetti');if(!cv)return;const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#ffcf3f','#ff6b9a','#8f7bff','#3ddc84','#4d96ff','#ffffff'];
    const P=Array.from({length:180},(_,i)=>({x:innerWidth*(i%2?.25:.75),y:innerHeight*.45,vx:(Math.random()-.5)*18+(i%2?4:-4),vy:-Math.random()*16-6,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]}));
    let f=0;const step=()=>{ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.38;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-f/200);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(++f<200)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height)};step()}
};
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const r=b.getBoundingClientRect();const d=Math.max(r.width,r.height);const sp=document.createElement('span');sp.className='rip';sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),650)});
document.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');c.style.setProperty('--rx',((.5-y)*8).toFixed(2)+'deg');c.style.setProperty('--ry',((x-.5)*10).toFixed(2)+'deg')});

function renderDrawer(){

function shell(inner,g){return `<header class="topbar"><button class="burger" id="burger" aria-label="${t('menu')}"><i></i><i></i><i></i></button><a class="logo" href="#home"><span class="dice">🎲</span><b>G3verse</b></a>${g?`<span class="crumb">/ ${g.emoji} ${esc(L(g.name))}</span>`:''}</header><main>${inner}</main>`}
function bindShell(){$('#burger').onclick=openDrawer}

/* ================= ROUTEUR ================= */
let currentId=(location.hash||'').slice(1);
function go(id){currentId=id;closeDrawer();try{if(location.hash.slice(1)!==id)location.hash=id}catch(e){}route()}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute('href').slice(1))});
function route(){cleanup();const h=currentId;const g=GAMES.find(x=>x.id===h);document.title=g?L(g.name)+' · G3verse':'G3verse';if(g)renderGame(g);else renderHome();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h===currentId)return;currentId=h;closeDrawer();route()});

/* ================= ACCUEIL ================= */
let filter='all',query='';
function renderHome(){
  app.innerHTML=shell(`<section class="hero"><h1>G3verse</h1><p>${t('tagline')}</p><div class="searchrow"><input id="q" placeholder="🔍 ${t('search')}" value="${esc(query)}"><div class="chips">${['all','daily','solo','party','words','guess'].map(f=>`<button class="chip ${f===filter?'on':''}" data-f="${f}">${t(f)}</button>`).join('')}</div></div></section><section class="grid" id="grid"></section>`);
  bindShell();drawGrid();
  $('#q').oninput=e=>{query=e.target.value;drawGrid()};
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));drawGrid()});
}
function drawGrid(){
  const q=norm(query);
  const list=GAMES.filter(g=>(filter==='all'||g.tags.includes(filter))&&(!q||norm(Object.values(g.name).join(' ')+' '+L(g.desc)+' '+(g.insp||'')).includes(q)));
  $('#grid').innerHTML=list.length?list.map((g,i)=>`<a class="card" href="#${g.id}" style="--c:${g.color};--i:${i}"><div class="cicon">${g.emoji}</div><h3>${esc(L(g.name))}</h3><p>${esc(L(g.desc))}</p><div class="cfoot">${g.tags.map(x=>`<span class="tag ${x==='daily'?'day':''}">${x==='daily'?'📅 ':''}${t(x)}</span>`).join('')}${g.insp?`<span class="insp">${t('inspired')} ${esc(g.insp)}</span>`:''}</div><span class="playbtn">${t('play')} →</span></a>`).join(''):`<p class="muted">${t('noresult')}</p>`;
}

/* Carte : tuiles OpenStreetMap/CARTO ; si elles ne chargent pas, un planisphère quadrillé reste visible dessous */
function staticMap(host,lat,lon,label){
  let z=13;draw();
  function draw(){
    const W=host.clientWidth||400,H=260,n=2**z;
    const x=(lon+180)/360*n*256,y=(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n*256;
    const x0=x-W/2,y0=y-H/2;let tiles='';
    for(let tx=Math.floor(x0/256);tx<=Math.floor((x0+W)/256);tx++)for(let ty=Math.floor(y0/256);ty<=Math.floor((y0+H)/256);ty++){if(ty<0||ty>=n)continue;const wx=((tx%n)+n)%n;tiles+=`<img alt="" src="https://tile.openstreetmap.org/${z}/${wx}/${ty}.png" style="left:${Math.round(tx*256-x0)}px;top:${Math.round(ty*256-y0)}px" onerror="this.remove()">`}
    const px=(lon+180)/360*100,py=(90-lat)/180*100;
    const fb=`<svg class="fb" viewBox="0 0 360 180" preserveAspectRatio="none"><rect width="360" height="180" fill="#9cc3d5"/>${Array.from({length:11},(_,i)=>`<line x1="${i*36}" y1="0" x2="${i*36}" y2="180" stroke="#ffffff55" stroke-width=".5"/>`).join('')}${Array.from({length:7},(_,i)=>`<line x1="0" y1="${i*30}" x2="360" y2="${i*30}" stroke="#ffffff55" stroke-width=".5"/>`).join('')}<circle cx="${px*3.6}" cy="${py*1.8}" r="40" fill="#ffcf3f33"/><circle cx="${px*3.6}" cy="${py*1.8}" r="3" fill="#e63946"/></svg>`;
    host.innerHTML=`<div class="smap">${fb}${tiles}<div class="pin">📍</div><div class="lbl">📍 ${esc(label)} · ${lat.toFixed(3)}, ${lon.toFixed(3)}</div><div class="zb"><button data-z="1">+</button><button data-z="-1">−</button></div><div class="attr">© OpenStreetMap</div></div>`;
    host.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{z=Math.min(17,Math.max(3,z+ +b.dataset.z));draw()});
  }
}
function gallery(el,imgs,credit){
  el.classList.add('gal');el.innerHTML=imgs.map((u,i)=>`<img alt="" src="${esc(u)}" class="${i===0?'on':''}">`).join('')+`<button class="nav p">‹</button><button class="nav n">›</button><div class="dots">${imgs.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div><span class="cap">${credit}</span>`;
  let k=0;const show=j=>{k=(j+imgs.length)%imgs.length;el.querySelectorAll('img').forEach((m,i)=>m.classList.toggle('on',i===k));el.querySelectorAll('.dots i').forEach((m,i)=>m.classList.toggle('on',i===k))};
  el.querySelector('.p').onclick=()=>show(k-1);el.querySelector('.n').onclick=()=>show(k+1);
  el.querySelectorAll('img').forEach(m=>m.onerror=()=>m.remove());
  const iv=setInterval(()=>{if(!el.isConnected)return clearInterval(iv);show(k+1)},4000);timers.push(iv);
}
GAME_IMPL.loyer=root=>{
  const N=5;let rounds=shuffle(RENTS).slice(0,N),i=0,total=0;show();
  function show(){
    const h=rounds[i];
    root.innerHTML=`<div class="bar"><span>${t('round')} ${i+1}/${N}</span><span>${t('score')} : <b>${fmt(total)}</b></span></div>
    <div class="listing"><div class="lmedia"><div id="map"></div><div class="lphoto" id="ph">${h.e}</div></div>
    <div class="linfo"><h2>${h.f} ${esc(h.c)}</h2><div class="pills"><span>📐 <b>${h.m2} m²</b></span><span>🚪 <b>${h.r}</b> ${t('loy_rooms')}</span><span>🏢 ${t('loy_floor',{n:h.fl})}</span>${h.fu?`<span>🛋️ ${t('loy_furn')}</span>`:''}${h.b?`<span>🌿 ${t('loy_balcony')}</span>`:''}</div></div></div>
    <h3 class="q">${t('loy_q')}</h3>
    <div class="guessbox"><input type="range" id="rg" min="200" max="4000" step="10" value="1200"><div class="numrow"><input type="number" id="rn" value="1200" min="0" max="20000"><b>€ / ${t('month')}</b></div><button class="primary" id="ok">${t('validate')}</button></div><div id="res"></div><p class="note">${t('loy_note')}</p>`;
    staticMap($('#map'),h.la,h.lo,h.c);
    const credit=`📷 ${esc(h.by)} · ${esc(h.lic)} · Wikimedia Commons`;
    if(h.ph)gallery($('#ph'),h.ph.map(x=>CM+encodeURIComponent(x.replace(/ /g,'_'))+'?width=1280'),credit);
    else if(h.ids)commons({action:'query',pageids:h.ids.join('|'),prop:'imageinfo',iiprop:'url',iiurlwidth:'1280'}).then(d=>{const m={};(d.query&&d.query.pages||[]).forEach(x=>{if(x.imageinfo)m[x.pageid]=x.imageinfo[0].thumburl||x.imageinfo[0].url});const u=h.ids.map(i=>m[i]).filter(Boolean);if(u.length&&$('#ph'))gallery($('#ph'),u,credit)}).catch(()=>{});
    const rg=$('#rg'),rn=$('#rn');rg.oninput=()=>rn.value=rg.value;rn.oninput=()=>rg.value=rn.value;
    rn.onkeydown=e=>{if(e.key==='Enter')$('#ok').click()};
    $('#ok').onclick=()=>{
      const g=Math.max(0,+rn.value||0),pts=Math.round(1000*Math.max(0,1-Math.abs(g-h.p)/h.p));total+=pts;
      rg.disabled=rn.disabled=true;$('#ok').remove();const last=i===N-1;
      $('#res').innerHTML=`<div class="result fade"><div>${t('loy_yours')} : <b>${fmt(g)} €</b> · ${t('loy_real')} : <b style="color:var(--accent)">${fmt(h.p)} €</b></div><div class="big" style="color:${pts>700?'var(--good)':pts>350?'var(--mid)':'var(--bad)'}">${t('loy_pts',{n:pts})}</div><div class="actions"><button class="primary" id="nx">${t('next')} →</button></div></div>`;
      if(pts>=800)fx.toast('🎯 +'+pts);
      $('#nx').onclick=()=>{if(last)end();else{i++;show()}};
    };
  }
  function end(){if(total>=N*600)fx.confetti();root.innerHTML=`<div class="panel center fade"><div style="font-size:3rem">🏆</div><div class="big">${t('loy_end',{n:fmt(total),m:fmt(N*1000)})}</div><div class="actions" style="justify-content:center"><button class="primary" id="re">${t('restart')}</button></div></div>`;$('#re').onclick=()=>{rounds=shuffle(RENTS).slice(0,N);i=0;total=0;show()}}
};

function parseSem(s){const p=s.split('|');const w={};p[1].split(',').forEach(x=>{const m=x.trim().match(/^(.*)\s(-?\d+)$/);if(m)w[norm(m[1])]=+m[2]});w[norm(p[0])]=100;return{s:p[0],w,r:p.slice(2)}}
GAME_IMPL.semantik=root=>{
  const c=cl(),n=dayNum(),P=parseSem(SEMRAW[c][(n-1)%SEMRAW[c].length]);
  const key=`lv-sem-${c}-${n}`,aiKey=`lv-semai-${c}-${n}`;
  const st=store.get(key,{g:[],won:false});const ai=store.get(aiKey,{});let lastW=st.g.length?st.g[st.g.length-1].w:null,busy=false;
  const hash=s=>{let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h};
  const emo=s=>s>=100?'🥳':s>=75?'🔥':s>=55?'🥵':s>=35?'😎':s>=15?'🥶':'🧊';
  const color=s=>s>=75?'#ff3d3d':s>=55?'#ff8a3d':s>=35?'#ffcf3f':s>=15?'#5ec8f0':'#4d6bff';
  root.innerHTML=`${dailyBar(n)}${cnote()}<p class="intro">${t('sem_intro')}</p><form id="f" class="inrow"><input id="w" placeholder="${t('sem_ph')}" autocomplete="off" autocapitalize="off"><button class="primary">${t('validate')}</button></form><div id="msg" class="msg"></div><div id="hints"></div><div id="list" class="semlist"></div><p class="note" id="ainote"></p>`;
  startCountdown();
  const inp=$('#w');
  function lookup(n0){if(P.w[n0]!=null)return P.w[n0];for(const v of [n0.replace(/[sx]$/,''),n0+'s',n0.replace(/e$/,'')])if(P.w[v]!=null)return P.w[v];return null}
  async function score(word){
    const n0=norm(word).replace(/[^a-z0-9\- ]/g,'');if(!n0)return null;
    const k=lookup(n0);if(k!=null)return{w:n0,s:k};
    if(ai[n0]!=null)return ai[n0]===false?false:{w:n0,s:ai[n0]};
    if(SAMPLE){
      $('#msg').textContent=t('sem_wait');
      const r=await askClaude(`You score words for a daily semantic guessing game like Cemantix, in ${c==='fr'?'French':'English'}. Secret word: "${P.s}". Guessed word: "${n0}". Reply ONLY with JSON {"valid":boolean,"score":number}. valid=false if "${n0}" is not a real ${c==='fr'?'French':'English'} word. score = semantic closeness to the secret word from -20 to 95: 80-95 near-synonym or very strongly linked, 55-79 strongly related, 30-54 related, 5-29 weakly related, below 5 unrelated. Never 100.`);
      if(r&&typeof r.score==='number'){if(r.valid===false){ai[n0]=false;store.set(aiKey,ai);return false}const s=Math.max(-20,Math.min(95,Math.round(r.score)));ai[n0]=s;store.set(aiKey,ai);return{w:n0,s}}
    }
    return{w:n0,s:(hash(P.s+n0)%30)-14};
  }
  function row(g){return `<div class="srow ${g.w===lastW?'last':''}"><span class="n">${g.n}</span><span class="w">${esc(g.w)}</span><span class="tmp">${g.s}°C</span><span>${emo(g.s)}</span><div class="meter"><i style="width:${Math.max(2,g.s)}%;background:${color(g.s)}"></i></div></div>`}
  function draw(){
    const last=st.g.find(g=>g.w===lastW);
    $('#list').innerHTML=(last?row(last)+'<div style="height:8px"></div>':'')+st.g.slice().sort((a,b)=>b.s-a.s).map(row).join('');
    const unlocked=Math.min(P.r.length,Math.floor(st.g.length/50));
    $('#hints').innerHTML=P.r.slice(0,unlocked).map((r,i)=>`<div class="riddle">🧩 <b>${t('sem_riddle',{i:i+1})}</b> — ${esc(r)}</div>`).join('')+(!st.won&&unlocked<P.r.length?`<div class="muted" style="margin:6px 0">${t('sem_next',{n:50*(unlocked+1)-st.g.length})} · ${t('sem_count',{n:st.g.length})}</div>`:'');
    if(st.won){inp.disabled=true;$('#msg').innerHTML=`<span style="color:var(--good)">${t('sem_found',{n:st.g.length})}</span> ${t('comeback',{n:n+1})}`}
    $('#ainote').textContent=SAMPLE?t('sem_ai'):'';
  }
  draw();if(!st.won)inp.focus();
  $('#f').onsubmit=async e=>{e.preventDefault();if(st.won||busy)return;const v=inp.value.trim().split(/\s+/)[0];inp.value='';if(!v)return;
    const vn=norm(v);if(st.g.some(g=>g.w===vn)){lastW=vn;$('#msg').textContent=t('sem_already');draw();return}
    busy=true;const r=await score(v);busy=false;if(!root.isConnected)return;
    if(r===false){$('#msg').textContent=t('sem_unknown')+' : '+v;fx.shake(inp);return}if(!r)return;
    if(st.g.some(g=>g.w===r.w)){lastW=r.w;$('#msg').textContent=t('sem_already');draw();return}
    st.g.push({w:r.w,s:r.s,n:st.g.length+1});lastW=r.w;$('#msg').textContent='';if(r.s>=100){st.won=true;fx.confetti()}else if(r.s>=75)fx.toast('🔥 '+esc(r.w)+' · '+r.s+'°C');store.set(key,st);draw();};
};

function trimExtract(x){const paras=x.split(/\n+/).filter(p=>p.trim().length>40);let out='';for(const p of paras){if(out.length>1300)break;out+=(out?'\n':'')+p.trim()}if(out.length>2200){const cut=out.slice(0,2200);out=cut.slice(0,cut.lastIndexOf('.')+1)||cut}return out}
GAME_IMPL.pedanto=root=>{
  const c=cl(),c0=c,n=dayNum(),key=`lv-ped-${c}-${n}`;
  root.innerHTML=`${dailyBar(n)}${cnote()}<p class="intro">${t('ped_intro')}</p><div id="pb"><p class="muted">${t('loading')}</p></div>`;startCountdown();
  const title=PTITLES[c][(n-1)%PTITLES[c].length];
  wapi(c,{action:'query',prop:'extracts',explaintext:'1',exintro:'1',redirects:'1',titles:title}).then(d=>{const p=d.query.pages[0];if(!p||!p.extract)throw new Error('empty');play(p.title.replace(/\s*\(.*\)\s*$/,''),trimExtract(p.extract),true)}).catch(()=>{const F=PED[c][(n-1)%PED[c].length];play(F.t,F.x,false)});
  function play(T,X,live){
    if(!root.isConnected)return;
    const keyOf=w=>{let k=norm(w);if(k.length>3&&/[sx]$/.test(k))k=k.slice(0,-1);return k};
    const tok=s=>s.split(/([\p{L}\p{N}]+)/u).map((p,i)=>({s:p,w:i%2===1,k:i%2===1?keyOf(p):''}));
    const TT=tok(T),TX=tok(X),ALL=[...TT,...TX].filter(o=>o.w);
    const keys=[...new Set(ALL.map(o=>o.k))];
    let st=store.get(key,null);if(!st||st.v!==2||st.t!==T)st={v:2,t:T,g:[],won:false,near:{}};
    const rev=new Set(st.g.filter(x=>x.k).map(x=>x.k));let fresh=new Set(),busy=false;
    const count=k=>ALL.filter(o=>o.k===k).length;
    const lev=(a,b)=>{const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]};
    const tol=n=>n>=8?2:n>=4?1:0;
    const dice=(a,b)=>{if(a.length<3||b.length<3)return 0;const bg=x=>{const m=new Map();for(let i=0;i<x.length-1;i++){const y=x.slice(i,i+2);m.set(y,(m.get(y)||0)+1)}return m};const A=bg(a),B=bg(b);let n=0;A.forEach((v,k)=>{n+=Math.min(v,B.get(k)||0)});return 2*n/(a.length+b.length-2)};
    /* orange foncé (peu proche) -> jaune clair (très proche) */
    const nearBg=s=>{const u=Math.max(0,Math.min(1,(s-.3)/.65));return `hsl(${18+u*36} ${92-u*6}% ${34+u*50}%)`};
    $('#pb').innerHTML=`${live?'':`<div class="cnote">📴 ${t('offline')}</div>`}<form id="f" class="inrow"><input id="w" placeholder="${t('ped_ph')}" autocomplete="off" autocapitalize="off"><button class="primary">${t('validate')}</button></form><div id="msg" class="msg"></div><div class="panel"><div class="ptitle" id="pt"></div><div class="ptext" id="px"></div>${live?`<p class="note">${t('source')}</p>`:''}</div><div class="glog" id="log"></div><p class="note">${t('ped_legend')}</p>`;
    const inp=$('#w');
    const rend=(arr,all)=>arr.map(o=>{
      if(!o.w)return esc(o.s).replace(/\n/g,'<br><br>');
      if(all||rev.has(o.k))return fresh.has(o.k)?`<span class="new">${esc(o.s)}</span>`:esc(o.s);
      const l=[...o.s].length,w=(l*.6+.25).toFixed(2),nr=st.near[o.k];
      if(nr)return `<span class="hid near" title="${l}" style="width:${w}em;background:${nearBg(nr.s)};color:${nr.s>.62?'#3b2600':'#fff'}">${esc(nr.g)}</span>`;
      return `<span class="hid" title="${l}" style="width:${w}em"></span>`}).join('');
    function draw(){const all=st.won;$('#pt').innerHTML=rend(TT,all);$('#px').innerHTML=rend(TX,all);
      $('#log').innerHTML=st.g.slice().reverse().map(x=>`<span>${x.c?(x.fix?`✏️ ${esc(x.w)} → <b>${esc(x.fix)}</b> ×${x.c}`:t('ped_hits',{w:esc(x.w),n:x.c})):t('ped_miss',{w:esc(x.w)})}</span>`).join('');
      if(st.won){inp.disabled=true;$('#msg').innerHTML=`<span style="color:var(--good)">${t('ped_found',{n:st.g.length})}</span> ${t('comeback',{n:n+1})}`}}
    draw();if(!st.won)inp.focus();
    $('#f').onsubmit=async e=>{e.preventDefault();if(st.won||busy)return;const v=inp.value.trim().split(/\s+/)[0];inp.value='';if(!v)return;
      let k=keyOf(v);if(!k)return;
      if(st.g.some(x=>keyOf(x.w)===k||(x.k&&x.k===k&&rev.has(k)&&x.fix===null&&keyOf(x.w)===k))){$('#msg').textContent='↩︎ '+v;fx.shake(inp);return}
      let fix=null;
      if(!keys.includes(k)){const tl=tol(k.length);if(tl){let best=null,bd=99;for(const kk of keys){if(Math.abs(kk.length-k.length)>tl)continue;const d=lev(k,kk);if(d<=tl&&d<bd){bd=d;best=kk}}if(best){k=best;fix=ALL.find(o=>o.k===best).s}}}
      if(fix&&rev.has(k)){$('#msg').textContent='↩︎ '+fix;return}
      const c=keys.includes(k)?count(k):0;fresh=new Set();$('#msg').textContent='';
      if(c){rev.add(k);fresh.add(k);delete st.near[k];st.g.push({w:v,k,c,fix});if(fix)fx.toast(`✏️ « ${esc(v)} » → « ${esc(fix)} »`)}
      else{
        st.g.push({w:v,k:null,c:0,fix:null});
        const hidden=keys.filter(x=>!rev.has(x)&&x.length>=3);const sc={};
        hidden.forEach(h=>{const d=dice(k,h);if(d>=.5)sc[h]=.3+.45*(d-.5)/.5});
        if(SAMPLE&&hidden.length){busy=true;$('#msg').textContent='…';
          const r=await askClaude(`Word game like Pedantix, in ${c0==='fr'?'French':'English'}. The player guessed "${v}". From the list below, pick the words that are semantically close to the guess (synonyms, same word family, strongly associated). Reply ONLY with JSON {"m":{"word":score}} where score is between 0.3 (loosely related) and 0.95 (near synonym). Use the words exactly as written in the list, at most 12 words, and leave out unrelated words. List: ${JSON.stringify(hidden.slice(0,300))}`);
          busy=false;if(!root.isConnected)return;$('#msg').textContent='';
          if(r&&r.m&&typeof r.m==='object')for(const[w,x]of Object.entries(r.m)){const kk=keyOf(w);if(hidden.includes(kk)&&typeof x==='number')sc[kk]=Math.max(sc[kk]||0,Math.min(.95,Math.max(.3,x)))}}
        let any=false;for(const[h,x]of Object.entries(sc))if(!st.near[h]||st.near[h].s<x){st.near[h]={g:v,s:x};any=true}
        if(!any)fx.shake(inp);
      }
      if(TT.every(o=>!o.w||rev.has(o.k))){st.won=true;fx.confetti()}
      store.set(key,st);draw();};
  }
};

function makeCanvas(host){
  const COLORS=['#1a1a1a','#e63946','#ff8a3d','#ffcf3f','#3ddc84','#4d96ff','#a66cff','#8b5a2b','#ff8fc7'];
  host.innerHTML=`<div class="tools">${COLORS.map((c,i)=>`<button class="sw ${i===0?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}<span class="sep"></span>${[4,10,22].map((s,i)=>`<button class="sz ${i===1?'on':''}" data-s="${s}"><i style="width:${s/2+4}px;height:${s/2+4}px"></i></button>`).join('')}<button class="er">🧽 ${t('des_eraser')}</button><button class="clr">🗑️ ${t('des_clear')}</button></div><canvas width="1000" height="700" class="cv"></canvas>`;
  const cv=host.querySelector('canvas'),ctx=cv.getContext('2d');
  const blank=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)};blank();ctx.lineCap='round';ctx.lineJoin='round';
  let col=COLORS[0],size=10,erase=false,drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  const w=()=>size*(erase?2.5:1)*1.25;
  cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);ctx.fillStyle=erase?'#fff':col;ctx.beginPath();ctx.arc(last[0],last[1],w()/2,0,7);ctx.fill()});

function cleanWikiHtml(html){

  r.querySelectorAll('script,style,link,meta,.mw-editsection,sup.reference,.reference,.mw-references-wrap,.references,.reflist,.navbox,.navbox-styles,.metadata,.noprint,.mw-empty-elt,.bandeau-portail,.homonymie,.ambox,.mbox-small,#toc,.toc,.printfooter,.catlinks').forEach(e=>e.remove());
  r.querySelectorAll('img').forEach(i=>{const s=i.getAttribute('src');if(s&&s.startsWith('//'))i.setAttribute('src','https:'+s);const ss=i.getAttribute('srcset');if(ss)i.setAttribute('srcset',ss.replace(/(^|\s)\/\//g,'$1https://'));i.setAttribute('loading','lazy')});
  r.querySelectorAll('a').forEach(a=>{const h=a.getAttribute('href')||'';const m=h.match(/^(?:\.\/|\/wiki\/)([^#?]+)/);if(m){const ti=decodeURIComponent(m[1]).replace(/_/g,' ');if(!NS.test(ti)){const s=doc.createElement('a');s.className='wl';s.dataset.t=ti;s.innerHTML=a.innerHTML;a.replaceWith(s);return}}const sp=doc.createElement('span');sp.innerHTML=a.innerHTML;a.replaceWith(sp)});

    const ids=Object.keys(WIKI);const links=id=>[...WIKI[id].x.fr.matchAll(/\[\[(\w+)\|/g)].map(m=>m[1]);
    const bfs=s=>{const d={[s]:0},q=[s];while(q.length){const u=q.shift();for(const v of links(u))if(d[v]==null){d[v]=d[u]+1;q.push(v)}}return d};
    const rng=mulberry(n*7919+(c==='fr'?1:2));let start,target,best;do{start=ids[Math.floor(rng()*ids.length)];target=ids[Math.floor(rng()*ids.length)];best=bfs(start)[target]}while(start===target||!(best>=3));
    const st=store.get(key,{path:[start],clicks:0,won:false,mode:'mini'});if(st.mode!=='mini'){st.path=[start];st.clicks=0;st.won=false;st.mode='mini'}

const CAST_COLORS=['#ff6b9a','#4d96ff','#3ddc84','#ffbe0b'];
GAME_IMPL.mime=root=>{
  const c=cl();let flt=0;list();
  cleanups.push(()=>{if(micStream){micStream.getTracks().forEach(x=>x.stop());micStream=null}});
  function list(){
    root.innerHTML=`${cnote()}<p class="intro">${t('mime_intro')}</p><div class="seg" style="margin-bottom:12px">${[0,1,2,3].map(k=>`<button data-k="${k}" class="${k===flt?'on':''}">${k===0?t('all'):k===3?'👥 3+':'👥 '+k}</button>`).join('')}</div>
    <div class="scenes">${SCENES.map((s,i)=>({s,i})).filter(({s})=>!flt||(flt===3?s.cast.fr.length>=3:s.cast.fr.length===flt)).map(({s,i})=>`<button class="scard" data-i="${i}"><span class="se">${s.e}</span><b>${esc(s.ti[c])}</b><span class="muted">${esc(s.g[c])} · ${s.l.length} ${c==='fr'?'phrases':'lines'}</span><span class="badge">${t('mime_persons',{n:s.cast.fr.length})}</span></button>`).join('')}
    <button class="scard imp" id="imp"><span class="se">📁</span><b>${t('mime_import')}</b><span class="muted">${t('mime_import_d')}</span></button></div>`;
    root.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{flt=+b.dataset.k;list()});
    root.querySelectorAll('.scard[data-i]').forEach(b=>b.onclick=()=>scene(SCENES[+b.dataset.i]));
    $('#imp').onclick=video;
  }
  async function micOrWarn(el){try{return await getMic()}catch(e){el.innerHTML=`<div class="cnote">${t('mime_mic')}</div>`;return null}}
  /* --- scène intégrée --- */
  function scene(S){
    const cast=S.cast[c],L2=S.l.map(x=>({who:x[0],txt:c==='fr'?x[1]:x[2]}));const takes=[];let i=0,rec=null;
    const tts=('speechSynthesis' in window);
    const speak=(k)=>new Promise(res=>{if(!tts)return res();const u=new SpeechSynthesisUtterance(L2[k].txt);u.lang=c==='fr'?'fr-FR':'en-GB';u.pitch=[1,.6,1.5,1.2][L2[k].who];u.rate=1;u.onend=res;u.onerror=res;speechSynthesis.speak(u)});
    function draw(){
      const ln=L2[i],col=CAST_COLORS[ln.who];
      root.innerHTML=`<div class="actions" style="margin:0 0 12px"><button id="bk">${t('mime_back')}</button></div><h2 style="margin-bottom:8px">${S.e} ${esc(S.ti[c])} <span class="tag">${t('mime_persons',{n:cast.length})}</span></h2>
      <div class="cast">${cast.map((p,k)=>`<span style="background:${CAST_COLORS[k]}33;color:${CAST_COLORS[k]}">${esc(p)}</span>`).join('')}</div>
      <div class="linecard fade" style="border-color:${col}"><div class="muted">${t('mime_line',{i:i+1,n:L2.length})}</div><div class="who" style="color:${col}">${esc(cast[ln.who])}</div><div class="txt">« ${esc(ln.txt)} »</div>
      <div class="actions" style="justify-content:center"><button id="pv" ${i===0?'disabled':''}>←</button><button id="or" ${tts?'':'disabled'}>${t('mime_orig')}</button><button class="primary ${rec?'rec':''}" id="rc">${rec?t('mime_stop'):t('mime_rec')}</button><button id="tk" ${takes[i]?'':'disabled'}>${t('mime_take')}</button><button id="nx" ${i===L2.length-1?'disabled':''}>→</button></div><div id="mw"></div></div>
      <div class="actions"><button id="all" ${tts?'':'disabled'}>${t('mime_playall')}</button><button class="primary" id="dub" ${takes.some(Boolean)?'':'disabled'}>${t('mime_playdub')}</button></div>
      <p class="note">${tts?t('mime_orig_note'):t('mime_tts')}</p>
      <div class="lines">${L2.map((x,k)=>`<div data-k="${k}" class="${k===i?'on':''}"><span>${takes[k]?'✅':'⬜'}</span><b style="color:${CAST_COLORS[x.who]}">${esc(cast[x.who])}</b><span>${esc(x.txt)}</span></div>`).join('')}</div>`;
      $('#bk').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}list()};
      $('#pv').onclick=()=>{i--;draw()};$('#nx').onclick=()=>{i++;draw()};
      $('#or').onclick=()=>{speechSynthesis.cancel();speak(i)};
      $('#tk').onclick=()=>new Audio(takes[i]).play();
      root.querySelectorAll('.lines div').forEach(d=>d.onclick=()=>{i=+d.dataset.k;draw()});
      $('#rc').onclick=async()=>{if(rec){rec.stop();const url=await rec.done;rec=null;takes[i]=url;if(i<L2.length-1)i++;draw();return}const s=await micOrWarn($('#mw'));if(!s)return;rec=startRec(s);draw()};
      $('#all').onclick=async()=>{speechSynthesis.cancel();for(let k=0;k<L2.length;k++){if(!root.isConnected)return;i=k;draw();await speak(k)}};
      $('#dub').onclick=async()=>{for(let k=0;k<L2.length;k++){if(!root.isConnected)return;i=k;draw();if(takes[k])await new Promise(r=>{const a=new Audio(takes[k]);a.onended=r;a.onerror=r;a.play().catch(r)});else await speak(k)}};
    }
    draw();
  }
  /* --- import d'un extrait vidéo --- */
  function video(){
    let phrases=[],cuts=[],takes=[],people=2,bg='r',actx=null,gO,gL,gR,stopFlag=false;
    root.innerHTML=`<div class="actions" style="margin:0 0 12px"><button id="bk">${t('mime_back')}</button></div><h2 style="margin-bottom:10px">📁 ${t('mime_import')}</h2>
    <div class="row2"><label class="f">${t('mime_video')}<input type="file" id="fv" accept="video/*"></label><label class="f">${t('mime_srt')}<input type="file" id="fs" accept=".srt,.vtt,text/plain"></label></div>
    <div class="row2" style="margin-top:10px"><label class="f">${t('mime_people')}<input type="number" id="pp" min="1" max="20" value="${people}"></label><label class="f">${t('mime_bg')}<select id="bgm"><option value="r">${t('mime_bg_r')}</option><option value="m">${t('mime_bg_m')}</option><option value="o">${t('mime_bg_o')}</option></select></label></div>
    <div id="vz" style="margin-top:14px"></div>`;
    $('#bk').onclick=list;$('#pp').oninput=e=>{people=+e.target.value||1;const b=$('#ppb');if(b)b.textContent=t('mime_persons',{n:people})};$('#bgm').onchange=e=>bg=e.target.value;
    $('#fv').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);cleanups.push(()=>URL.revokeObjectURL(url));
      $('#vz').innerHTML=`<span class="tag" id="ppb" style="background:var(--accent);color:#1b1b1b;font-weight:700">${t('mime_persons',{n:people})}</span><video id="vd" src="${url}" controls playsinline style="margin-top:8px"></video><p class="note">${t('mime_cut_h')}</p><div class="actions"><button class="primary" id="cut">${t('mime_cut')}</button><button id="rst">${t('mime_reset')}</button><button id="dub" class="primary">${t('mime_playdub')}</button><button id="stp">${t('mime_stopall')}</button></div><div id="mw"></div><div id="ph"></div>`;
      const v=$('#vd');
      $('#cut').onclick=()=>{cuts.push(v.currentTime);cuts.sort((a,b)=>a-b);fromCuts();drawPh()};
      $('#rst').onclick=()=>{cuts=[];phrases=[];takes=[];drawPh()};
      $('#stp').onclick=()=>{stopFlag=true;v.pause()};
      $('#dub').onclick=playDub;
      v.onloadedmetadata=()=>{if(phrases.length===0&&cuts.length===0)drawPh()};
    };
    $('#fs').onchange=async e=>{const f=e.target.files[0];if(!f)return;phrases=parseSrt(await f.text());takes=[];drawPh()};
    function fromCuts(){const v=$('#vd');const pts=[0,...cuts];phrases=pts.map((s,k)=>({s,e:k+1<pts.length?pts[k+1]:(cuts.length?Math.min(v.duration||s+5,s+8):s),txt:''})).filter(p=>p.e-p.s>0.2)}
    function parseSrt(txt){return txt.replace(/\r/g,'').split(/\n\n+/).map(b=>{const m=b.match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);if(!m)return null;const tm=(h,mi,s,ms)=>+h*3600+ +mi*60+ +s+ +ms/1000;const lines=b.split('\n');const idx=lines.findIndex(l=>l.includes('-->'));return{s:tm(m[1],m[2],m[3],m[4]),e:tm(m[5],m[6],m[7],m[8]),txt:lines.slice(idx+1).join(' ').replace(/<[^>]+>/g,'')}}).filter(Boolean)}
    const ft=x=>{const m=Math.floor(x/60),s=(x%60).toFixed(1).padStart(4,'0');return `${m}:${s}`};
    function drawPh(){const el=$('#ph');if(!el)return;el.innerHTML=phrases.length?phrases.map((p,k)=>`<div class="phr"><span class="tm">#${k+1}<br>${ft(p.s)}–${ft(p.e)}</span><span>${esc(p.txt||'…')}</span><span class="bt"><button data-a="o" data-k="${k}">${t('mime_orig')}</button><button data-a="r" data-k="${k}" class="primary">${t('mime_dub')}</button><button data-a="t" data-k="${k}" ${takes[k]?'':'disabled'}>${t('mime_take')}</button></span></div>`).join(''):'';
      el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(b.dataset.a==='o')seg(k,'o');else if(b.dataset.a==='r')recSeg(k,b);else new Audio(takes[k]).play()})}
    function graph(){const v=$('#vd');if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();const src=actx.createMediaElementSource(v);const sp=actx.createChannelSplitter(2);gO=actx.createGain();gL=actx.createGain();gR=actx.createGain();const sum=actx.createGain();src.connect(gO).connect(actx.destination);src.connect(sp);sp.connect(gL,0);sp.connect(gR,1);gL.connect(sum);gR.connect(sum);sum.connect(actx.destination);cleanups.push(()=>actx.close())}catch(e){actx=null}}
    function setMode(m){const v=$('#vd');graph();if(!actx){v.muted=m!=='o';return}actx.resume();v.muted=false;gO.gain.value=m==='o'?1:0;gL.gain.value=m==='r'?1:0;gR.gain.value=m==='r'?-1:0}
    function seg(k,mode){return new Promise(res=>{const v=$('#vd'),p=phrases[k];setMode(mode);v.currentTime=p.s;v.play().catch(()=>{});const iv=setInterval(()=>{if(!root.isConnected||v.currentTime>=p.e||v.paused){clearInterval(iv);v.pause();res()}},40);timers.push(iv)})}
    async function recSeg(k,btn){const s=await micOrWarn($('#mw'));if(!s)return;btn.classList.add('rec');const r=startRec(s);await seg(k,bg);r.stop();takes[k]=await r.done;drawPh()}
    function playDub(){const v=$('#vd');if(!v)return;stopFlag=false;setMode(bg);const played=new Set();v.currentTime=0;v.play().catch(()=>{});const iv=setInterval(()=>{if(stopFlag||!root.isConnected||v.ended){clearInterval(iv);return}phrases.forEach((p,k)=>{if(takes[k]&&!played.has(k)&&v.currentTime>=p.s&&v.currentTime<p.e){played.add(k);new Audio(takes[k]).play().catch(()=>{})}})},40);timers.push(iv)}
  }
};

  const sz=(o,hh)=>{o.style.height=hh+'px';const s=o.querySelector('.te');s.style.height=Math.max(2,hh)+'px';s.style.width=Math.max(2,hh)+'px'};
  function niceStep(x){const p=10**Math.floor(Math.log10(x));const m=x/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p}

    const T=list[i];const H=T[2]*(1.4+Math.random()*1.8);

    const vstep=px(step);for(let x=vstep;x<FW;x+=vstep)g+=`<div class="vgl" style="left:${x}px"></div>`;

    let drag=false;
    const mv=e=>{if(!drag||locked)return;const r=tg.getBoundingClientRect();set(r.bottom-e.clientY)};
    hd.addEventListener('pointerdown',e=>{if(locked)return;e.preventDefault();e.stopPropagation();drag=true;const up=()=>{drag=false;window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up)};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);cleanups.push(up)});
    tg.addEventListener('pointerdown',e=>{if(locked||e.target===hd)return;const r=tg.getBoundingClientRect();set(r.bottom-e.clientY)});
    $('#ok').onclick=()=>{
      locked=true;hd.remove();const gm=h/FH*H,r=T[2],pts=Math.round(1000*Math.max(0,1-Math.abs(Math.log10(gm/r))/0.4));total+=pts;
      tg.insertAdjacentHTML('beforeend',`<div class="gl real" style="bottom:${Math.min(FH,px(r))}px"><span>${t('tai_real')} : ${fmtLen(r)}</span></div>`);
      requestAnimationFrame(()=>{tgt.style.transition='';tgt.querySelector('.te').style.transition='';sz(tgt,Math.min(FH,px(r)))});
      $('#ok').remove();const last=i===N-1;if(pts>=800)fx.toast('🎯 +'+pts);
      $('#res').innerHTML=`<div class="result fade"><div>${t('tai_yours')} : <b>${fmtLen(gm)}</b> · ${t('tai_real')} : <b style="color:var(--accent)">${fmtLen(r)}</b></div><div class="big" style="color:${pts>700?'var(--good)':pts>350?'var(--mid)':'var(--bad)'}">+${pts}</div><div class="actions"><button class="primary" id="nx">${t('next')} →</button></div></div>`;
      $('#nx').onclick=()=>{if(last)end();else{i++;show()}};
    };
  }
  show();
  function end(){if(total>=N*600)fx.confetti();root.innerHTML=`<div class="panel center fade"><div style="font-size:3rem">📏</div><div class="big">${t('tai_end',{n:fmt(total),m:fmt(N*1000)})}</div><div class="actions" style="justify-content:center"><button class="primary" id="re">${t('restart')}</button></div></div>`;$('#re').onclick=()=>{list=shuffle(SIZES).slice(0,N);i=0;total=0;show()}}
};

  <div class="stage ${mode}" id="stage"><canvas></canvas><div class="herowrap"><div class="herobob">${mode==='abyss'?DIVER_SVG:ROCKET_SVG}</div></div>
  <div class="hud-round" id="hr"></div><div class="hud"><div class="hud-n" id="hudn">0 ${unit}</div><div class="hud-l">${mode==='abyss'?t('aby_total'):t('spa_total')}</div><div class="hud-next" id="hudnext"></div></div>
  <div class="qpanel" id="qp"></div></div>`;
  const scene=makeScene($('#stage'),mode,(d)=>{const v=Math.round(d);if(v!==shown){shown=v;const e=$('#hudn');if(e)e.textContent=(mode==='abyss'&&v>0?'−':'')+fmt(v)+' '+unit}});
  cleanups.push(()=>scene.destroy());
  const nextMs=()=>{const m=MILESTONES[mode].find(([d])=>d>total);const e=$('#hudnext');if(e)e.innerHTML=m?`${t('qa_nextms')} : ${esc(L(m[1]))} · ${fmt(m[0])} ${unit}`:'∞'};
  const mult=()=>round>N?Math.pow(2,Math.floor((round-N-1)/4)+1):1;
  ask();
  function ask(){
    if(qi>=qs.length){qs=shuffle(bank);qi=0}const Q=qs[qi++];round++;let tries=3,busy=false;
    $('#hr').textContent=round>N?`${t('round')} ${round} · ∞ · ×${mult()}`:`${t('round')} ${round}/${N}`;nextMs();
    $('#qp').innerHTML=`<div class="qq">${esc(Q.q)} ?</div><form id="f" class="inrow"><input id="w" placeholder="${t('qa_ph')}" autocomplete="off" autocapitalize="off"><button class="primary">${t('validate')}</button></form><div class="msg" id="msg"></div><div id="res"><button id="sk">${t('qa_skip')}</button></div>`;
    const inp=$('#w');inp.focus({preventScroll:true});
    const finish=(rar,label,ai,idx)=>{
      inp.disabled=true;$('#f').querySelector('button').disabled=true;
      const base=rar==null?0:Math.round(mode==='abyss'?30+1370*Math.pow(rar,1.2):50+4950*Math.pow(1-rar,1.2));const gain=base*mult();total+=gain;scene.setTarget(total);nextMs();
      const endOfSet=round===N;
      $('#res').innerHTML=`<div class="result">${rar==null?`<div>${t('qa_zero')}</div>`:`<div class="gain" style="color:${mode==='abyss'?'#7dd3fc':'#c4b5fd'}">${mode==='abyss'?'⬇️':'⬆️'} +${fmt(gain)} ${unit}${mult()>1?` <small style="font-size:.9rem;opacity:.8">(×${mult()})</small>`:''}</div><div>« ${esc(label)} » ${idx!=null?'· '+t('qa_rank',{r:idx+1,n:Q.disp.length}):''}</div>${ai?`<div class="muted">${t('qa_ai')}</div>`:''}`}
      <div style="margin-top:8px"><b>${t('qa_top')}</b><div class="taglist">${Q.disp.slice(0,5).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><div style="margin-top:8px"><b>${t('qa_rare')}</b><div class="taglist">${Q.disp.slice(-5).reverse().map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>
      ${endOfSet?`<div class="big" style="margin-top:12px">${mode==='abyss'?t('aby_end',{n:fmt(total)}):t('spa_end',{n:fmt(total)})}</div>`:''}
      <div class="actions"><button class="primary" id="nx">${endOfSet?t('qa_endless'):t('next')+' →'}</button>${endOfSet?`<button id="re">🔄 ${t('restart')}</button>`:''}</div></div>`;
      if(gain>0)fx.toast(`${mode==='abyss'?'🤿':'🚀'} +${fmt(gain)} ${unit}`);
      if(endOfSet)fx.confetti();
      const crossed=MILESTONES[mode].filter(([d])=>d<=total&&d>total-gain);if(crossed.length)setTimeout(()=>fx.toast(`🏁 ${esc(L(crossed[crossed.length-1][1]))}`),900);
      $('#nx').onclick=ask;const re=$('#re');if(re)re.onclick=()=>{qs=shuffle(bank);qi=0;round=0;total=0;scene.setTarget(0);ask()};
    };
    $('#sk').onclick=()=>finish(null);
    $('#f').onsubmit=async e=>{e.preventDefault();if(busy||inp.disabled)return;const v=inp.value.trim();if(!v)return;const k=qn(v);
      const idx=Q.ans.findIndex(a=>a.includes(k));
      if(idx>=0)return finish(idx/(Q.ans.length-1),Q.disp[idx],false,idx);
      if(SAMPLE){busy=true;$('#msg').textContent=t('qa_check');
        const r=await askClaude(`Game like "Pointless"/"Family Feud" in ${c==='fr'?'French':'English'}. Question: "${Q.q}". A player answered: "${v}". Reply ONLY with JSON {"valid":boolean,"popularity":number}. valid=true only if it is a correct answer to the question. popularity 0-100 = how often a random group of 100 ${c==='fr'?'French':'English'}-speaking people would give this answer (the most obvious answers ~90-100, rare but correct answers ~1-10).`);
        busy=false;if(!root.isConnected)return;$('#msg').textContent='';
        if(r&&r.valid&&typeof r.popularity==='number'){const pop=Math.max(0,Math.min(100,r.popularity));return finish(1-pop/100,v,true,null)}}
      tries--;inp.value='';fx.shake(inp);if(tries<=0)return finish(null);$('#msg').textContent=t('qa_unknown',{n:tries});};
  }
}

GAME_IMPL.motus=root=>{
  const c=cl();let cfg=store.get('lv-motus',{len:5,d:'med'}),word,rows,cur,done,kb,fixed,auto,MAXT;
  setup();
  function setup(){
    keyHandler=null;
    root.innerHTML=`${cnote()}<p class="intro">${t('mot_intro')}</p><div class="panel"><div class="opt"><b>${t('mot_len')}</b><div class="seg">${[5,6,7,8].map(n=>`<button data-l="${n}" class="${cfg.len===n?'on':''}">${n}</button>`).join('')}</div></div>
    <div class="opt"><b>${t('mot_diff')}</b><div class="seg">${['easy','med','hard'].map(d=>`<button data-d="${d}" class="${cfg.d===d?'on':''}">${t('mot_'+d)}</button>`).join('')}</div><p class="muted" style="margin:8px 0 0">${t('mot_'+cfg.d+'_d')}</p></div><button class="primary" id="go">${t('play')} →</button></div>`;
    root.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cfg.len=+b.dataset.l;setup()});
    root.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{cfg.d=b.dataset.d;setup()});
    $('#go').onclick=()=>{store.set('lv-motus',cfg);start()};
  }
  function start(){
    const pool=MOTUS[c][cfg.len][cfg.d==='hard'?'h':'c'].split(' ');word=rnd(pool).toUpperCase();rows=[];done=false;kb={};MAXT=cfg.d==='easy'?7:6;
    fixed={};if(cfg.d!=='hard')fixed[0]=word[0];if(cfg.d==='easy'){const j=1+Math.floor(Math.random()*(cfg.len-1));fixed[j]=word[j]}
    cur='';auto=new Set();justRow=-1;won=false;autofill();draw('');
    keyHandler=e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='INPUT')return;if(e.key==='Enter'){e.preventDefault();press('ENTER')}else if(e.key==='Backspace')press('DEL');else if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase())};
  }
  function autofill(){while(cur.length<cfg.len&&fixed[cur.length]){auto.add(cur.length);cur+=fixed[cur.length]}}
  function evalRow(g){const n=cfg.len,r=Array(n).fill('b'),cnt={};for(let i=0;i<n;i++){if(g[i]===word[i])r[i]='g';else cnt[word[i]]=(cnt[word[i]]||0)+1}for(let i=0;i<n;i++)if(r[i]!=='g'&&cnt[g[i]]){r[i]='y';cnt[g[i]]--}return r}
  let justRow=-1,won=false;
  function press(k){
    if(done)return;let m='';const n=cfg.len;justRow=-1;
    if(k==='DEL'){let i=cur.length-1;while(i>=0&&fixed[i])i--;if(i>=0){cur=cur.slice(0,i);auto=new Set([...auto].filter(x=>x<i));autofill()}}
    else if(k==='ENTER'){if(cur.length<n){m=t('mot_short',{n});setTimeout(()=>fx.shake(root.querySelectorAll('.mrow')[rows.length]),0)}else{const r=evalRow(cur);rows.push({g:cur,r});justRow=rows.length-1;[...cur].forEach((ch,i)=>{const p={g:3,y:2,b:1};if(!kb[ch]||p[r[i]]>p[kb[ch]])kb[ch]=r[i]});
      if(cur===word){done=true;won=true;m=`<span style="color:var(--good)">${t('mot_win')}</span>`;setTimeout(()=>fx.confetti(),700)}else if(rows.length>=MAXT){done=true;m=t('mot_lose',{w:`<b style="color:var(--accent)">${word}</b>`})}cur='';auto=new Set();autofill()}}
    else if(cur.length<n){const p=cur.length-1;if(p>=0&&auto.has(p)&&cur[p]===k){auto.delete(p)}else{cur+=k;auto=new Set([...auto].filter(x=>x<cur.length-1));autofill()}}
    draw(m);
  }
  function draw(m){
    const n=cfg.len;let g='';
    for(let i=0;i<MAXT;i++){g+=`<div class="mrow ${i===justRow?(won?'reveal win':'reveal'):''}">`;
      if(i<rows.length)for(let j=0;j<n;j++)g+=`<div class="mc ${rows[i].r[j]}">${rows[i].g[j]}</div>`;
      else if(i===rows.length&&!done)for(let j=0;j<n;j++)g+=cur[j]?`<div class="mc">${cur[j]}</div>`:`<div class="mc fx">${fixed[j]||'·'}</div>`;
      else for(let j=0;j<n;j++)g+='<div class="mc"></div>';
      g+='</div>'}
    const R=lang==='fr'?['AZERTYUIOP','QSDFGHJKLM','WXCVBN']:['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
    const kbd=R.map((r,ri)=>`<div class="kr">${ri===2?'<button class="k" data-k="ENTER">↵</button>':''}${[...r].map(ch=>`<button class="k ${kb[ch]||''}" data-k="${ch}">${ch}</button>`).join('')}${ri===2?'<button class="k" data-k="DEL">⌫</button>':''}</div>`).join('');
    root.innerHTML=`<div class="bar"><span>${n} ${t('mot_len').toLowerCase()} · ${t('mot_'+cfg.d)} · ${t('tries')} ${rows.length}/${MAXT}</span><button id="chg" style="padding:4px 12px">${t('mot_change')}</button></div><div class="mgrid">${g}</div><div class="msg center">${m||''}</div>${done?`<div class="actions" style="justify-content:center;margin-bottom:14px"><button class="primary" id="re">🔄 ${t('restart')}</button></div>`:''}<div class="kb">${kbd}</div>`;
    root.querySelectorAll('.k').forEach(b=>b.onclick=()=>press(b.dataset.k));
    $('#chg').onclick=setup;if(done)$('#re').onclick=start;
  }
};

{id:'rivers',e:'🌊',q:{fr:'Les plus longs fleuves du monde',en:'The longest rivers in the world'},src:'Wikipedia',a:['Nil|Nile','Amazone|Amazon|amazonas','Yangtsé|Yangtze|yangtse|yang tse|chang jiang|yangzi','Mississippi||missouri|mississippi missouri','Ienisseï|Yenisei|ienissei|yenisei|ienisei','Fleuve Jaune|Yellow River|huang he|fleuve jaune','Ob||ob irtych|irtych','Paraná|Parana','Congo||fleuve congo','Amour|Amur|amur|heilong']},
{id:'peaks',e:'🏔️',q:{fr:'Les plus hautes montagnes du monde',en:'The highest mountains in the world'},src:'Wikipedia',a:['Everest||mont everest|chomolungma','K2||','Kangchenjunga||kanchenjunga|kangchenjunga|kangchendzonga','Lhotse||','Makalu||','Cho Oyu||','Dhaulagiri||','Manaslu||','Nanga Parbat||','Annapurna||']}];
const tkey=x=>norm(x).replace(/[^a-z0-9ㄱ-힝]/g,'');
GAME_IMPL.top10=root=>{
  const best=store.get('lv-top10',{});
  const parseA=x=>{const p=x.split('|');const fr=p[0],en=p[1]||fr;return{fr,en,keys:[fr,en,...p.slice(2)].map(tkey).filter(Boolean)}};
  const lev=(a,b)=>{const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]};
  const tol=n=>n>=8?2:n>=5?1:0;
  let bag=[];
  const next=()=>{if(!bag.length)bag=shuffle(TOP10.map((_,i)=>i));play(bag.pop())};
  const menu=next;
  next();
  function play(qi){
    const Q=TOP10[qi],A=Q.a.map(parseA),found=new Set();let lives=3,over=false;
    const name=a=>lang==='fr'?a.fr:a.en;
    root.innerHTML=`<div class="panel"><div class="muted">${Q.e} Top 10</div><div class="tq">${esc(L(Q.q))}</div>
      <form id="f" class="inrow"><input id="w" placeholder="${t('top_ph')}" autocomplete="off" autocapitalize="off"><button class="primary">${t('validate')}</button></form>
      <div class="tstat"><span>${t('top_found')} : <b id="fc">0</b>/10</span><span class="lives" id="lv"></span><span class="msg" id="msg" style="margin:0"></span></div>
      <div class="tboard" id="tb"></div><p class="note">${t('top_src')} : ${esc(Q.src)}</p>
      <div class="actions" id="act"><button id="gu">🏳️ ${t('top_giveup')}</button><button id="bk">⏭️ ${t('top_next')}</button></div></div>`;
    const inp=$('#w');inp.focus();
    const draw=(fresh)=>{
      $('#tb').innerHTML=A.map((a,i)=>{const f=found.has(i),miss=over&&!f;return `<div class="tslot ${f?'found':''} ${miss?'missed':''} ${i===0?'top1':''}" ${f&&i!==fresh?'style="animation:none"':''}><span class="rk">${i+1}</span><span class="tx ${f||miss?'':'hidden'}">${f||miss?esc(name(a)):'• • • • •'}</span></div>`}).join('');
      $('#fc').textContent=found.size;
      $('#lv').innerHTML=[0,1,2].map(i=>`<span class="${i<lives?'':'off'}">❤️</span>`).join('');
    };
    draw(-1);
    const finish=()=>{over=true;inp.disabled=true;draw(-1);
      const n=found.size;if(best[Q.id]==null||n>best[Q.id]){best[Q.id]=n;store.set('lv-top10',best)}
      if(n===10)fx.confetti();
      $('#act').innerHTML=`<div class="result" style="width:100%"><div class="big">${n===10?t('top_win'):t('top_end',{n})}</div><div class="actions"><button class="primary" id="ag">🔄 ${t('top_again')}</button><button id="bk">⏭️ ${t('top_next')}</button></div></div>`;
      $('#ag').onclick=()=>play(qi);$('#bk').onclick=menu;};
    $('#gu').onclick=finish;$('#bk').onclick=menu;
    $('#f').onsubmit=e=>{e.preventDefault();if(over)return;const v=inp.value.trim();inp.value='';if(!v)return;const k=tkey(v);if(!k)return;
      let idx=A.findIndex(a=>a.keys.includes(k));
      if(idx<0){let bd=99;A.forEach((a,i)=>a.keys.forEach(x=>{const tl=tol(x.length);if(!tl||Math.abs(x.length-k.length)>tl)return;const d=lev(k,x);if(d<=tl&&d<bd){bd=d;idx=i}}))}
      if(idx>=0&&found.has(idx)){$('#msg').textContent=t('top_dupe');fx.shake(inp);return}
      if(idx>=0){found.add(idx);$('#msg').innerHTML=`<span style="color:var(--good)">✅ n°${idx+1}</span>`;draw(idx);if(idx===0)fx.toast(`🥇 ${esc(name(A[0]))}`);if(found.size===10)finish();return}
      lives--;$('#msg').innerHTML=`<span style="color:var(--bad)">❌ ${t('top_miss')}</span>`;fx.shake($('#tb'));draw(-1);if(lives<=0)finish();};
  }
};

/* ================= DÉMARRAGE ================= */
document.documentElement.lang=lang;
route();
</script>
